server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /health { access_log off; default_type text/plain; return 200 "ok"; }
    location /api/ {
        # Re-resolve when Compose recreates the Spring container with a new IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend ${API_UPSTREAM};
        proxy_pass http://$api_backend;
        # Preserve the public authority, including a non-default demo port.
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
