name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B tools/check_modules.py
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/fusion-api/pom.xml test
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: python -m pip install pypdf==6.16.1
      - run: npx playwright test --reporter=line,html
        env:
          GLUCOTWIN_SOFTWARE_WEBGL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-report
          path: |
            frontend/dashboard/playwright-report
            frontend/dashboard/test-results
